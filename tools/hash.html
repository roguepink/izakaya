<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>合言葉の指紋を作る</title>
<style>body{font-family:sans-serif;max-width:520px;margin:24px auto;padding:0 16px;line-height:1.7}input,button{font-size:18px;padding:10px;width:100%;box-sizing:border-box;margin:6px 0}code{word-break:break-all;background:#eee;padding:8px;display:block;border-radius:6px}</style></head>
<body>
<h2>合言葉の「指紋」を作る</h2>
<p>合言葉を入れると、指紋(長い英数字)が出ます。それを <b>js/config.js</b> の <b>PASSCODE_HASH</b>(お店の合言葉)か <b>OWNER_HASH</b>(大将の合言葉)に貼ります。<br>合言葉そのものは、どこにも保存されません。</p>
<input id="p" type="text" placeholder="合言葉" autocomplete="off">
<button id="b">指紋を作る</button>
<code id="o">—</code>
<script>
document.getElementById('b').onclick = function () {
  var t = document.getElementById('p').value.trim();
  crypto.subtle.digest('SHA-256', new TextEncoder().encode(t)).then(function (buf) {
    document.getElementById('o').textContent = Array.prototype.map.call(new Uint8Array(buf), function (x) { return ('0' + x.toString(16)).slice(-2); }).join('');
  });
};
</script>
</body></html>
