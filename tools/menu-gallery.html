<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>料理の見本</title>
<style>html,body{margin:0;background:#1e130c;color:#fff;font-family:sans-serif}canvas{display:block;width:100vw;height:100vh}
#bar{position:fixed;top:8px;left:8px;right:8px;display:flex;gap:6px;flex-wrap:wrap}#bar button{font-size:14px;padding:6px 12px;border-radius:999px;border:0}
.lb{position:fixed;transform:translate(-50%,0);font-size:11px;background:rgba(0,0,0,.6);padding:1px 6px;border-radius:6px;white-space:nowrap;pointer-events:none}</style></head>
<body><div id="bar"><button data-s="0">ふつう</button><button data-s="1">半分</button><button data-s="2">食べ終わり</button><button data-c="drink">飲み物だけ</button><button data-c="food">料理だけ</button></div>
<canvas id="c"></canvas><div id="labels"></div>
<script src="../js/config.js"></script><script src="../js/avatar-data.js"></script>
<script type="module" src="../js/scene3d.js"></script>
<script type="module">
/* 料理と飲み物を全部ならべて見る(大将・作る人の確認用) */
const wait = () => new Promise((r) => { if (window.IZ3D) r(); else addEventListener('iz3d-ready', r, { once: true }); });
await wait();
const { THREE, buildItem } = window.IZ3D;
const cv = document.getElementById('c');
const R = new THREE.WebGLRenderer({ canvas: cv, antialias: true }); R.setPixelRatio(Math.min(devicePixelRatio, 2)); R.outputColorSpace = THREE.SRGBColorSpace;
const S = new THREE.Scene(); S.background = new THREE.Color('#2a1a10');
S.add(new THREE.HemisphereLight('#fff1dc', '#5a3a22', 1.5)); const d = new THREE.DirectionalLight('#ffd6a0', 1.8); d.position.set(1, 3, 2); S.add(d);
const cam = new THREE.PerspectiveCamera(32, 1, 0.05, 30);
let group = null, state = +(new URLSearchParams(location.search).get('s') || 0), only = new URLSearchParams(location.search).get('c') || '';
const labels = document.getElementById('labels');
function build() {
  if (group) S.remove(group); group = new THREE.Group(); S.add(group); labels.innerHTML = '';
  const items = SHOP.MENU.filter((m) => !only || (only === 'drink' ? m.kind === 'drink' : m.kind !== 'drink'));
  const cols = Math.ceil(Math.sqrt(items.length * (innerWidth / innerHeight))), gap = 0.32;
  items.forEach((it, i) => {
    const m = buildItem(it, state === 2, state === 1);
    m.position.set((i % cols - (cols - 1) / 2) * gap, 0, (Math.floor(i / cols)) * gap); m.userData.it = it; group.add(m);
  });
  const rows = Math.ceil(items.length / cols);
  group.add(Object.assign(new THREE.Mesh(new THREE.PlaneGeometry(cols * gap + 0.4, rows * gap + 0.4), new THREE.MeshLambertMaterial({ color: '#b98a55' })), {}));
  const floor = group.children[group.children.length - 1]; floor.rotation.x = -Math.PI / 2; floor.position.z = (rows - 1) * gap / 2;
  const cz = (rows - 1) * gap / 2, span = Math.max(cols * gap / (innerWidth / innerHeight), rows * gap) * 1.05;
  cam.position.set(0, span * 1.55, cz + span * 1.0); cam.lookAt(0, 0, cz + 0.02);
  window.__labels = items.map((it, i) => ({ it, m: group.children[i] }));
}
function resize() { R.setSize(innerWidth, innerHeight, false); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); build(); }
addEventListener('resize', resize); resize();
document.querySelectorAll('[data-s]').forEach((b) => b.onclick = () => { state = +b.dataset.s; build(); });
document.querySelectorAll('[data-c]').forEach((b) => b.onclick = () => { only = only === b.dataset.c ? '' : b.dataset.c; build(); });
(function loop() {
  requestAnimationFrame(loop); R.render(S, cam);
  let h = ''; const v = new THREE.Vector3();
  (window.__labels || []).forEach(({ it, m }) => { v.set(m.position.x, 0, m.position.z + 0.12).project(cam); h += `<div class="lb" style="left:${(v.x + 1) / 2 * innerWidth}px;top:${(1 - v.y) / 2 * innerHeight}px">${it.name}</div>`; });
  if (labels._h !== h) { labels.innerHTML = h; labels._h = h; }
})();
window.__ready = true;
</script></body></html>
