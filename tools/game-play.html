<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ミニゲームのためし</title>
<style>
  body{margin:0;background:#1a120c;color:#fbf3e4;font-family:"Hiragino Sans",sans-serif;padding:16px}
  h1{font-size:20px} button{font:inherit;font-size:17px;font-weight:700;border:0;border-radius:12px;padding:12px 14px;margin:6px 0;width:100%;text-align:left;background:#2a1d14;color:#fbf3e4;border:2px solid #8a5a2a}
  small{opacity:.7;font-weight:400} .off{border-style:dashed} p{opacity:.8;font-size:14px;line-height:1.7}
</style></head><body>
<h1>🎮 ミニゲームのためし(1人で遊ぶ)</h1>
<p>お店に出す前の ためし用です。点数は記録されません。<br>点線のものは まだ お店に出していないゲームです。<br>?g=ゲームの名前 を付けると、そのゲームが すぐ始まります。</p>
<div id="list"></div>
<script src="../js/config.js"></script>
<script>window.IZGAME_BASE = '../';</script>
<script src="../js/game-kit.js"></script>
<script>
  var L = (SHOP.GAMES || []), box = document.getElementById('list'), today = IZGAME.today();
  L.forEach(function (g) {
    var b = document.createElement('button'); if (g.off) b.className = 'off';
    b.innerHTML = g.icon + ' ' + g.name + (today && today.id === g.id ? ' <small>← 今日の日がわり</small>' : '') + '<br><small>' + (g.note || '') + '・' + (g.sec || 30) + '秒' + (g.off ? '・まだ お店に出していない' : '') + '</small>';
    b.onclick = function () { play(g.id); }; box.appendChild(b);
  });
  function play(id) { IZGAME.open({ game: id, any: true, seed: 'try-' + new Date().toDateString(), onEnd: function () { return 'ためしなので 記録はされません'; } }); }
  var q = new URLSearchParams(location.search).get('g'); if (q) play(q);
</script>
</body></html>
